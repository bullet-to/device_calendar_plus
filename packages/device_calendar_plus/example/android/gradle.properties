org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter's Gradle plugin still reads AGP's legacy DSL types; Flutter 3.47
# appends this opt-out itself on the first build, so it is stated here instead.
android.newDsl=false
# Same as Flutter's app template: with built-in Kotlin off, Flutter's Gradle
# plugin applies the KGP pinned in settings.gradle.kts to the app, and to any
# plugin that doesn't apply one itself. Flutter appends this opt-out on the
# first build otherwise. Flip to `true` once every plugin in the build has
# stopped applying `kotlin-android` (AGP 9 refuses KGP under built-in Kotlin).
android.builtInKotlin=false
