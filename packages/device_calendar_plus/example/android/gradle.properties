org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter's Gradle plugin still walks AGP's legacy variant API, so the new DSL
# stays off.
android.newDsl=false
# Built-in Kotlin for apps needs Flutter 3.47+. The example must stay buildable
# on the packages' 3.44 floor, and this matches the template, so it stays off.
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers
android.builtInKotlin=false
