org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter's Gradle plugin still walks AGP's legacy variant API, so the new DSL
# stays off.
android.newDsl=false
# Template default for apps whose plugins haven't migrated to built-in Kotlin.
# Ours has (#133); flip to true once the example is verified under built-in Kotlin.
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers
android.builtInKotlin=false
