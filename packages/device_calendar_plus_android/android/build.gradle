group = "to.bullet.device_calendar_plus_android"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Built-in Kotlin: the Kotlin Gradle Plugin is no longer applied here. When
// built-in Kotlin is on (AGP 9+, the default) AGP compiles Kotlin itself; when
// it's off, the Flutter Gradle plugin (3.44+) applies `kotlin-android` to
// plugin projects that don't. Applying it ourselves is what triggers Flutter's
// KGP deprecation warning (#133). This also means the script only configures
// under Flutter's Gradle plugin: there is no standalone `android/` build.
apply plugin: "com.android.library"

android {
    namespace = "to.bullet.device_calendar_plus_android"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    buildTypes {
        release {
            consumerProguardFiles("proguard-rules.pro")
        }
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    // Flutter's plugin template declares a bare `kotlin-test`, but picking the
    // JUnit flavour behind it is a KGP feature; under built-in Kotlin the suite
    // doesn't compile unless the JUnit 5 artifact is named directly.
    testImplementation("org.jetbrains.kotlin:kotlin-test-junit5")
    testImplementation("org.mockito:mockito-core:5.0.0")
}
