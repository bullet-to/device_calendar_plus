group = "to.bullet.device_calendar_plus_android"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        // Not applied below; kept for resolution, see the note above apply plugin.
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Built-in Kotlin (#133). Do not apply `kotlin-android` here: Flutter's
// Gradle plugin applies it when AGP < 9 / `android.builtInKotlin=false`, and
// AGP compiles Kotlin itself otherwise. KGP stays on the buildscript classpath
// above so that apply (and `JvmTarget` below) resolve. Requires Flutter >= 3.44.
// See https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
apply plugin: "com.android.library"

android {
    namespace = "to.bullet.device_calendar_plus_android"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    buildTypes {
        release {
            consumerProguardFiles("proguard-rules.pro")
        }
    }

    testOptions {
        // CalendarServiceTest drives CalendarService against a mocked
        // ContentResolver, and its path crosses android.jar stubs on the way
        // (ContentValues, CalendarContract's Uri constants); stubbed defaults
        // let those pass through instead of throwing "Stub!".
        //
        // This is module-wide: every unit test here now gets a silent
        // 0/null/false from any android.jar call it strays into, not a loud
        // failure. So no assertion may rest on a stubbed default — the
        // OS-shaped facts a test needs (the permission gates, say) must be
        // injected, as CalendarServiceTest does.
        unitTests.returnDefaultValues = true
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    // Flutter's plugin template declares a bare `kotlin-test`, but picking the
    // JUnit flavour behind it is a KGP feature; under built-in Kotlin the suite
    // doesn't compile unless the JUnit 5 artifact is named directly.
    testImplementation("org.jetbrains.kotlin:kotlin-test-junit5")
    testImplementation("org.mockito:mockito-core:5.0.0")
}
