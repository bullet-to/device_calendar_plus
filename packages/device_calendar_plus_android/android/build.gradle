group = "to.bullet.device_calendar_plus_android"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        // Not applied below; kept for resolution, see the note above apply plugin.
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Built-in Kotlin (#133): the Kotlin Gradle Plugin is not applied here,
// because an applied `kotlin-android` is exactly what Flutter's KGP
// deprecation detector flags. With built-in Kotlin on (AGP 9+, the default)
// AGP compiles Kotlin itself; with it off, Flutter's Gradle plugin (3.44+)
// applies `kotlin-android` for us. KGP stays on the buildscript classpath
// above so that apply resolves even in a host app whose root `plugins {}`
// block doesn't declare KGP (Flutter's failure message otherwise asks the
// app to), and so `org.jetbrains.kotlin.gradle.dsl.JvmTarget` resolves in
// the `kotlin {}` block. Flutter's own plugin template keeps it too. As a
// result this script only configures under Flutter's Gradle plugin: there
// is no standalone `android/` build.
apply plugin: "com.android.library"

android {
    namespace = "to.bullet.device_calendar_plus_android"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    buildTypes {
        release {
            consumerProguardFiles("proguard-rules.pro")
        }
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    // Flutter's plugin template declares a bare `kotlin-test`, but picking the
    // JUnit flavour behind it is a KGP feature; under built-in Kotlin the suite
    // doesn't compile unless the JUnit 5 artifact is named directly.
    testImplementation("org.jetbrains.kotlin:kotlin-test-junit5")
    testImplementation("org.mockito:mockito-core:5.0.0")
}
